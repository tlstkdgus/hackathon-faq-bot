# 시연용: 저장소에 들어 있는 예시 데이터(sample-data)로 현황판을 띄운다.
# 실제 학생 질문이 없으므로 토큰 없이 공개해도 된다.
#
#   cd dashboard
#   docker compose -f docker-compose.demo.yml up -d --build
#   → http://localhost:8080
services:
  api:
    build:
      context: ..
      dockerfile: dashboard/api/Dockerfile
    environment:
      DASHBOARD_DEMO: "1"
    volumes:
      - ./sample-data:/data:ro
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
