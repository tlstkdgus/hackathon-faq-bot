# 운영용: 봇이 쌓는 실제 로그를 읽어 현황판을 띄운다.
#
#   cd dashboard
#   cp .env.example .env      # DASHBOARD_TOKEN, LOG_DIR 채우기
#   docker compose up -d --build
#   → http://<서버>:8080/?token=<DASHBOARD_TOKEN>
#
# 실제 로그에는 학생 질문 원문이 들어 있다. DASHBOARD_TOKEN을 반드시 설정하고,
# 가능하면 포트를 공개하지 말고 SSH 터널로 접속한다 (README 참고).
services:
  api:
    build:
      context: ..
      dockerfile: dashboard/api/Dockerfile
    environment:
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?DASHBOARD_TOKEN을 .env에 설정하세요}
      DASHBOARD_ID_SALT: ${DASHBOARD_ID_SALT:-change-me}
    volumes:
      # 봇의 DATA_DIR(로그 폴더)을 읽기 전용으로 붙인다. 현황판은 로그를 고치지 않는다.
      - ${LOG_DIR:?LOG_DIR을 .env에 설정하세요}:/data:ro
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: unless-stopped
