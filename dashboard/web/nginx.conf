# 화면(정적 파일)과 API를 같은 주소로 묶는다.
# 브라우저는 /api/...를 같은 출처로 부르므로 CORS 설정이 필요 없다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Dashboard-Token $http_x_dashboard_token;
    }

    # FastAPI가 만들어 주는 API 문서
    location = /docs { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }

    location / {
        try_files $uri /index.html;
    }

    # 빌드 파일은 이름에 해시가 붙으므로 오래 캐시해도 된다
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
